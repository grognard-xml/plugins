name: Build LJB plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check out LJB host (import plugin smoke tests)
        uses: actions/checkout@v4
        with:
          repository: lejeanbaptiste/lejeanbaptiste
          path: leaf-writer
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest lxml
      - name: Validate manifests
        run: npm run validate
      - name: Build plugin archives
        run: npm run release
        env:
          LJB_HOST_ROOT: ${{ github.workspace }}/leaf-writer
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'release/plugins-index.json,release/archives/*'
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
